name: dcomp
services:
  # ----------------------------------------------------------------------------
  # Setup the local redis server.
  #
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: dcomp_redis_service
    hostname: redis
    command: [
      "redis-server",
      "--appendonly",
      "yes",
      "--requirepass",
      "${REDIS_PASS}",
      "--save",
      "60",
      "1",
      "--loglevel",
      "warning"
    ]
    ports:
      - "6379:6379"
    volumes:
      - 'redis_data:/data'
    networks:
      cache:
        aliases:
        - redis
      storage:
        aliases:
        - redis

  # ----------------------------------------------------------------------------
  # Setup the local postgres server.
  #
  postgres:
    image: postgres:13
    restart: unless-stopped
    command: postgres -c 'max_connections=10000'
    container_name: dcomp_postgres_service
    hostname: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - 'pg_data:/var/lib/postgresql/data'
    networks:
      storage:
        aliases:
        - postgres

  # ----------------------------------------------------------------------------
  # Setup the local postgres admin.
  #
  pgadmin:
    restart: unless-stopped
    container_name: dcomp_pgadmin_service
    image: dpage/pgadmin4
    environment:
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
        - 5050:80
    volumes:
      - 'pgadmin_data:/var/lib/pgadmin'
    networks:
      storage:
        aliases:
        - pgadmin

networks:
  storage:
  cache:
volumes:
  redis_data:
  pg_data:
  pgadmin_data:
